<!DOCTYPE html>
<html>
  <head>
    <title>ABOUT ZENO</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background-image: url("zeno-bg.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* =========================
         NAVBAR (MATCHES index.html)
      ========================= */

      nav {
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 0 25px;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        opacity: 0;
        transition: opacity 1.5s ease;
      }

      nav.show {
        opacity: 1;
      }

      .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 70px;
      }

      .nav-logo {
        color: #00d4ff;
        font-size: 1.7em;
        font-weight: bold;
        letter-spacing: 2px;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .nav-logo:hover {
        color: #00f0ff;
      }

      .nav-links {
        display: flex;
        list-style: none;
        gap: 25px;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 0.95em;
        font-weight: 500;
        position: relative;
        transition: color 0.3s ease;
      }

      .nav-links a:hover {
        color: #00d4ff;
      }

      .nav-links a::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -5px;
        left: 0;
        background-color: #00d4ff;
        transition: width 0.3s ease;
      }

      .nav-links a:hover::after {
        width: 100%;
      }

      .nav-cta {
        background: linear-gradient(135deg, #00d4ff, #0099cc);
        color: white;
        padding: 9px 22px;
        border: none;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .nav-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
      }

      /* =========================
         CONTENT
      ========================= */

      .content {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(ellipse at center, rgba(0, 20, 40, 0.4) 0%, rgba(0, 0, 0, 0.5) 100%);
        gap: 40px;
        padding: 140px 40px 40px 40px;
        text-align: center;
      }

      .content h1 {
        text-align: center;
        color: #00d4ff;
        font-size: 3.5em;
        font-weight: 900;
        letter-spacing: 4px;
        text-shadow: 0 0 20px rgba(0, 212, 255, 0.8), 0 0 40px rgba(0, 212, 255, 0.4);
        animation: neon-pulse 2s ease-in-out infinite;
      }

      @keyframes neon-pulse {
        0%, 100% {
          text-shadow: 0 0 20px rgba(0, 212, 255, 0.8), 0 0 40px rgba(0, 212, 255, 0.4);
        }
        50% {
          text-shadow: 0 0 30px rgba(0, 212, 255, 1), 0 0 50px rgba(0, 212, 255, 0.6);
        }
      }

      .content p {
        max-width: 900px;
        text-align: center;
        color: #00d4ff;
        font-size: 1em;
        line-height: 1.6;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        padding: 20px;
        margin: 0 auto;
      }

      .content p strong {
        color: #00f0ff;
        text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
      }

      /* =========================
         MOBILE
      ========================= */

      @media (max-width: 700px) {
        nav {
          padding: 0 15px;
        }

        .nav-container {
          height: 65px;
        }

        .nav-links {
          display: none;
        }

        .nav-logo {
          font-size: 1.6em;
        }

        .nav-cta {
          padding: 10px 20px;
          font-size: 0.9em;
        }

        .content {
          padding: 110px 20px 40px 20px;
        }

        .content h1 {
          font-size: 2.2em;
        }

        .content p {
          font-size: 0.95em;
        }
      }
    </style>
  </head>

  <body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>
      <div class="nav-container">

        <a href="index.html" class="nav-logo">ZENO</a>

        <ul class="nav-links">
          <li><a href="About.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="Link 3.html">REPORT</a></li>
        </ul>

        <a href="index.html" class="nav-cta">Get Started</a>

      </div>
    </nav>

    <!-- =========================
         ABOUT CONTENT
    ========================= -->

    <div class="content">

      <h1>WHAT IS ZENO</h1>

      <p>ZENO IS AN URBAN AI PLAYGROUND.BUILT TO HELP USER <strong>EVALUATE PROBLEMS,CODE,CREATE,AND IMAGINE</strong></p>

    </div>

    <!-- =========================
         NAV SHOW SCRIPT (matches index behavior)
    ========================= -->

    <script>
      // Add the 'show' class to reveal the nav (same timing as index.html)
      setTimeout(() => {
        const nav = document.querySelector('nav');
        if (nav) nav.classList.add('show');
      }, 3000);
    </script>

  </body>
</html>
