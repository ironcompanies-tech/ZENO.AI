<!DOCTYPE html>
<html>
  <head>
    <title>ZENO</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background-image: url("zeno-bg.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* =========================
         NAVBAR
      ========================= */

      nav {
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        padding: 0 40px;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

        /* Initially hidden */
        opacity: 0;
        transition: opacity 1.5s ease;
      }

      /* Navbar appears */
      nav.show {
        opacity: 1;
      }

      .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 100px;
      }

      .nav-logo {
        color: #00d4ff;
        font-size: 2.3em;
        font-weight: bold;
        letter-spacing: 2px;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .nav-logo:hover {
        color: #00f0ff;
      }

      .nav-links {
        display: flex;
        list-style: none;
        gap: 40px;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 1.15em;
        font-weight: 500;
        position: relative;
        transition: color 0.3s ease;
      }

      .nav-links a:hover {
        color: #00d4ff;
      }

      .nav-links a::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -5px;
        left: 0;
        background-color: #00d4ff;
        transition: width 0.3s ease;
      }

      .nav-links a:hover::after {
        width: 100%;
      }

      .nav-cta {
        background: linear-gradient(135deg, #00d4ff, #0099cc);
        color: white;
        padding: 12px 35px;
        border: none;
        border-radius: 25px;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .nav-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
      }

      /* =========================
         INTRO
      ========================= */

      .intro {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        opacity: 1;
        transition: opacity 1.5s ease;
      }

      .intro.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .intro h1 {
        text-align: center;
        color: white;
        font-size: 3.5em;
        text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.9);
        letter-spacing: 3px;
      }

      .intro p {
        max-width: 900px;
        text-align: center;
        color: white;
        font-size: 1.1em;
        line-height: 1.6;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
        padding: 20px;
      }

      /* =========================
         MOBILE
      ========================= */

      @media (max-width: 700px) {
        nav {
          padding: 0 15px;
        }

        .nav-container {
          height: 75px;
        }

        .nav-links {
          display: none;
        }

        .nav-logo {
          font-size: 1.8em;
        }

        .nav-cta {
          padding: 10px 20px;
          font-size: 0.9em;
        }

        .intro h1 {
          font-size: 2.2em;
        }

        .intro p {
          font-size: 0.95em;
        }
      }
    </style>
  </head>

  <body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>
      <div class="nav-container">

        <a href="#" class="nav-logo">ZENO</a>

        <ul class="nav-links">
          <li><a href="#link1">Link 1</a></li>
          <li><a href="#link2">Link 2</a></li>
          <li><a href="#link3">Link 3</a></li>
          <li><a href="#link4">Link 4</a></li>
        </ul>

        <a href="#" class="nav-cta">Get Started</a>

      </div>
    </nav>

    <!-- =========================
         ZENOVERSE INTRO
    ========================= -->

    <div class="intro" id="intro">

      <h1>WELCOME TO THE ZENOVERSE</h1>

      <p>
        ZENO IS AN URBAN AI PLAYGROUND BUILT BY IRONCOMPANIES,
        DESIGNED TO MAKE ARTIFICIAL INTELLIGENCE MORE
        <strong>INTERACTIVE, CREATIVE, AND ACCESSIBLE.</strong>
        INSTEAD OF SIMPLY ASKING AI QUESTIONS...
      </p>

    </div>

    <!-- =========================
         ANIMATION
    ========================= -->

    <script>
      setTimeout(() => {
        document.getElementById("intro").classList.add("fade-out");
        document.querySelector("nav").classList.add("show");
      }, 3000);
    </script>

  </body>
</html>
