<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CHAT WITH ZENO</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0.75)
        ),
        url("zeno-bg.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

      color: white;
    }


    /* =========================
       NAVBAR
    ========================= */

    nav {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      height: 70px;

      display: flex;
      align-items: center;

      background:
        rgba(0, 0, 0, 0.72);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border-bottom:
        1px solid rgba(0, 212, 255, 0.2);

      z-index: 1000;
    }


    .nav-container {

      width: 100%;
      max-width: 1200px;

      margin: auto;

      padding: 0 25px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .nav-logo {

      color: #00d4ff;

      font-size: 1.7em;

      font-weight: bold;

      letter-spacing: 2px;

      text-decoration: none;

      text-shadow:
        0 0 15px rgba(0, 212, 255, 0.8);
    }


    .nav-links {

      display: flex;

      list-style: none;

      gap: 25px;
    }


    .nav-links a {

      color: white;

      text-decoration: none;

      font-size: 0.95em;

      transition:
        color 0.3s ease;
    }


    .nav-links a:hover {

      color: #00d4ff;
    }


    .nav-cta {

      background:
        linear-gradient(
          135deg,
          #00d4ff,
          #0099cc
        );

      color: #001117;

      padding: 9px 22px;

      border-radius: 20px;

      text-decoration: none;

      font-weight: 700;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .nav-cta:hover {

      transform: translateY(-2px);

      box-shadow:
        0 8px 25px
        rgba(0, 212, 255, 0.4);
    }


    /* =========================
       MAIN
    ========================= */

    .main {

      min-height: 100vh;

      padding:
        105px 20px 30px;

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    h1 {

      color: #00d4ff;

      font-size: 2.5em;

      letter-spacing: 3px;

      text-align: center;

      text-shadow:
        0 0 15px rgba(0, 212, 255, 0.8),
        0 0 35px rgba(0, 212, 255, 0.4);

      margin-bottom: 8px;
    }


    .subtitle {

      text-align: center;

      color: #dffbff;

      letter-spacing: 2px;

      font-size: 0.9em;

      margin-bottom: 20px;
    }


    /* =========================
       MODE
    ========================= */

    .mode-display {

      padding: 7px 16px;

      border-radius: 20px;

      border:
        1px solid rgba(0, 212, 255, 0.5);

      background:
        rgba(0, 0, 0, 0.35);

      color: #00f0ff;

      font-size: 0.78em;

      font-weight: bold;

      letter-spacing: 1.5px;

      margin-bottom: 15px;

      text-transform: uppercase;

      box-shadow:
        0 0 15px
        rgba(0, 212, 255, 0.12);
    }


    /* =========================
       CHAT CONTAINER
    ========================= */

    .chat-container {

      width: 100%;

      max-width: 1000px;

      height: 70vh;

      min-height: 450px;

      display: flex;

      flex-direction: column;

      background:
        rgba(0, 0, 0, 0.48);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border:
        1px solid
        rgba(0, 212, 255, 0.3);

      border-radius: 18px;

      box-shadow:
        0 15px 60px
        rgba(0, 0, 0, 0.45),

        0 0 35px
        rgba(0, 212, 255, 0.08);

      overflow: hidden;
    }


    /* =========================
       MESSAGES
    ========================= */

    .messages {

      flex: 1;

      overflow-y: auto;

      padding: 25px;

      display: flex;

      flex-direction: column;
    }


    .messages::-webkit-scrollbar {

      width: 7px;
    }


    .messages::-webkit-scrollbar-track {

      background:
        rgba(0, 0, 0, 0.2);
    }


    .messages::-webkit-scrollbar-thumb {

      background:
        rgba(0, 212, 255, 0.35);

      border-radius: 10px;
    }


    .welcome {

      margin: auto;

      text-align: center;

      color: #00d4ff;

      font-weight: bold;

      letter-spacing: 2px;

      text-shadow:
        0 0 15px
        rgba(0, 212, 255, 0.6);
    }


    /* =========================
       MESSAGE BUBBLES
    ========================= */

    .message {

      width: fit-content;

      max-width: 75%;

      padding: 12px 16px;

      border-radius: 14px;

      margin-bottom: 12px;

      line-height: 1.5;

      word-wrap: break-word;

      white-space: pre-wrap;
    }


    .user-message {

      align-self: flex-end;

      background:
        linear-gradient(
          135deg,
          #00d4ff,
          #0099cc
        );

      color: #001117;

      font-weight: 600;

      border-bottom-right-radius: 4px;

      box-shadow:
        0 5px 18px
        rgba(0, 212, 255, 0.2);
    }


    .zeno-message {

      align-self: flex-start;

      background:
        rgba(0, 20, 35, 0.8);

      color: #eaffff;

      border:
        1px solid
        rgba(0, 212, 255, 0.3);

      border-bottom-left-radius: 4px;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.25);
    }


    /* =========================
       INPUT AREA
    ========================= */

    .input-area {

      display: flex;

      gap: 10px;

      padding: 15px;

      border-top:
        1px solid
        rgba(0, 212, 255, 0.2);

      background:
        rgba(0, 0, 0, 0.35);
    }


    .message-box {

      flex: 1;

      min-height: 48px;

      max-height: 130px;

      overflow-y: auto;

      padding: 13px 15px;

      border-radius: 12px;

      border:
        1px solid
        rgba(0, 212, 255, 0.35);

      background:
        rgba(0, 0, 0, 0.4);

      color: white;

      outline: none;

      font-family: inherit;

      line-height: 1.4;
    }


    .message-box:empty::before {

      content:
        "ASK ANY QUESTION...";

      color:
        rgba(255, 255, 255, 0.45);

      pointer-events: none;
    }


    .message-box:focus {

      border-color: #00d4ff;

      box-shadow:
        0 0 15px
        rgba(0, 212, 255, 0.15);
    }


    .send-button {

      min-width: 90px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #00d4ff,
          #0099cc
        );

      color: #001117;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .send-button:hover {

      transform: translateY(-2px);

      box-shadow:
        0 8px 20px
        rgba(0, 212, 255, 0.35);
    }


    .send-button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      nav {

        height: 65px;
      }


      .nav-container {

        padding: 0 15px;
      }


      .nav-links {

        display: none;
      }


      .nav-logo {

        font-size: 1.5em;
      }


      .nav-cta {

        padding: 8px 16px;

        font-size: 0.85em;
      }


      .main {

        padding:
          90px 10px 15px;
      }


      h1 {

        font-size: 1.8em;

        letter-spacing: 2px;
      }


      .subtitle {

        font-size: 0.75em;
      }


      .chat-container {

        height: 76vh;

        min-height: 400px;

        border-radius: 14px;
      }


      .messages {

        padding: 15px;
      }


      .message {

        max-width: 88%;
      }


      .input-area {

        padding: 10px;
      }


      .send-button {

        min-width: 70px;
      }
    }

  </style>

</head>


<body>


  <!-- =========================
       NAVBAR
  ========================= -->

  <nav>

    <div class="nav-container">

      <a
        href="index.html"
        class="nav-logo"
      >
        ZENO
      </a>


      <ul class="nav-links">

        <li>
          <a href="About.html">
            About
          </a>
        </li>

        <li>
          <a href="contact.html">
            Contact
          </a>
        </li>

        <li>
          <a href="Link 3.html">
            REPORT
          </a>
        </li>

      </ul>


      <a
        href="index.html"
        class="nav-cta"
      >
        Get Started
      </a>

    </div>

  </nav>



  <!-- =========================
       MAIN
  ========================= -->

  <main class="main">

    <h1>
      ASK ANY QUESTION
    </h1>


    <div class="subtitle">
      ENTER THE ZENOVERSE. THINK. CREATE. EXPLORE.
    </div>


    <div
      class="mode-display"
      id="modeDisplay"
    >
      GENERAL MODE
    </div>


    <div class="chat-container">


      <!-- =========================
           MESSAGES
      ========================= -->

      <div
        class="messages"
        id="messages"
      >

        <div
          class="welcome"
          id="welcome"
        >
          ZENO IS READY.
        </div>

      </div>



      <!-- =========================
           INPUT
      ========================= -->

      <div class="input-area">

        <div
          class="message-box"
          id="messageBox"
          contenteditable="true"
          role="textbox"
          aria-label="Message Zeno"
        ></div>


        <button
          class="send-button"
          id="sendButton"
          type="button"
        >
          SEND
        </button>

      </div>

    </div>

  </main>



  <!-- =========================
       ZENO AI FILES
  ========================= -->

  <script src="ai-filter.js"></script>

  <script src="general.js"></script>

  <script src="coding.js"></script>

  <script src="research.js"></script>

  <script src="image.js"></script>



  <!-- =========================
       ZENO CHAT ENGINE
  ========================= -->

  <script>

    /*
      ============================
      MODE DETECTION
      ============================
    */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const mode =
      params.get("mode") || "general";


    const modeDisplay =
      document.getElementById(
        "modeDisplay"
      );


    const modeNames = {

      think: "THINK MODE",

      create: "CREATE MODE",

      code: "CODE MODE",

      imagine: "IMAGINE MODE",

      general: "GENERAL MODE"

    };


    modeDisplay.textContent =
      modeNames[mode] ||
      "GENERAL MODE";



    /*
      ============================
      ELEMENTS
      ============================
    */

    const messageBox =
      document.getElementById(
        "messageBox"
      );


    const messages =
      document.getElementById(
        "messages"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const welcome =
      document.getElementById(
        "welcome"
      );



    /*
      ============================
      ADD MESSAGE
      ============================
    */

    function addMessage(
      text,
      type
    ) {

      const message =
        document.createElement(
          "div"
        );


      message.className =
        "message " +
        type;


      message.textContent =
        text;


      messages.appendChild(
        message
      );


      messages.scrollTop =
        messages.scrollHeight;


      return message;
    }



    /*
      ============================
      REMOVE WELCOME
      ============================
    */

    function removeWelcome() {

      if (welcome) {

        welcome.remove();

      }

    }



    /*
      ============================
      AI FILTER
      ============================
    */

    function getAIResponse(
      userMessage
    ) {

      /*
        Button mode gets priority.
      */

      let selectedAI =
        mode;


      /*
        Map the ZENO modes
        to your AI files.
      */

      if (mode === "think") {

        selectedAI =
          "general";

      }

      else if (mode === "create") {

        selectedAI =
          "image";

      }

      else if (mode === "code") {

        selectedAI =
          "coding";

      }

      else if (mode === "imagine") {

        /*
          Imagine can use the
          filtering system.
        */

        selectedAI =
          selectAI(userMessage);

      }

      else {

        selectedAI =
          selectAI(userMessage);

      }


      /*
        Route the request.
      */

      switch (selectedAI) {

        case "coding":

          return codingAI(
            userMessage
          );


        case "research":

          return researchAI(
            userMessage
          );


        case "image":

          return imageAI(
            userMessage
          );


        case "general":

        default:

          return generalAI(
            userMessage
          );

      }

    }



    /*
      ============================
      SEND MESSAGE
      ============================
    */

    async function sendMessage() {

      const userMessage =
        messageBox.innerText.trim();


      if (!userMessage) {

        return;

      }


      removeWelcome();


      /*
        User bubble
      */

      addMessage(
        userMessage,
        "user-message"
      );


      /*
        Clear input
      */

      messageBox.innerText =
        "";


      /*
        Thinking bubble
      */

      const thinking =
        addMessage(
          "ZENO IS THINKING...",
          "zeno-message"
        );


      sendButton.disabled =
        true;


      try {

        /*
          Ask AI FILTERING TECH
          which AI should handle it.
        */

        const result =
          await getAIResponse(
            userMessage
          );


        /*
          If the selected AI has
          not been connected to a
          real API yet, show its
          routing information.
        */

        if (
          result &&
          typeof result === "object"
        ) {

          if (result.response) {

            thinking.textContent =
              result.response;

          }

          else if (result.message) {

            thinking.textContent =
              "ROUTED TO " +
              result.type.toUpperCase() +
              " AI.\n\n" +
              result.message;

          }

          else {

            thinking.textContent =
              "ZENO ROUTED YOUR REQUEST TO " +
              result.type.toUpperCase() +
              " AI.";

          }

        }

        else {

          thinking.textContent =
            String(result);

        }

      }

      catch (error) {

        console.error(
          "ZENO ERROR:",
          error
        );


        thinking.textContent =
          "ZENO COULD NOT PROCESS THAT REQUEST.\n\n" +
          "ERROR: " +
          error.message;

      }


      sendButton.disabled =
        false;


      messageBox.focus();

    }



    /*
      ============================
      SEND BUTTON
      ============================
    */

    sendButton.addEventListener(
      "click",
      sendMessage
    );



    /*
      ============================
      ENTER TO SEND
      ============================
    */

    messageBox.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>


</body>

</html>
