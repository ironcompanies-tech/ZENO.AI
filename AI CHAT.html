<!DOCTYPE html>
<html>
<head>
  <title>CHAT WITH ZENO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      background-image: url("zeno-bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================
       HEADER
    ========================= */

    h1 {
      margin-top: 45px;

      color: #00d4ff;

      font-size: 2.2em;

      letter-spacing: 3px;

      text-shadow:
        0 0 12px rgba(0, 212, 255, 0.8),
        0 0 25px rgba(0, 212, 255, 0.4);
    }

    .subtitle {
      margin-top: 6px;

      color: #dffbff;

      font-size: 0.85em;

      letter-spacing: 1px;

      text-align: center;
    }


    /* =========================
       CHAT WINDOW
    ========================= */

    .chat-container {
      width: 88%;
      max-width: 720px;

      height: 52vh;

      margin-top: 22px;

      display: flex;
      flex-direction: column;

      background: rgba(0, 0, 0, 0.08);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      border:
        1px solid rgba(0, 212, 255, 0.25);

      border-radius: 14px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25);

      overflow: hidden;
    }


    /* =========================
       MESSAGE AREA
    ========================= */

    .messages {
      flex: 1;

      padding: 20px;

      overflow-y: auto;
    }

    .welcome {
      text-align: center;

      margin-top: 80px;

      color: #ffffff;

      font-size: 1.2em;

      font-weight: 700;

      letter-spacing: 1.5px;

      text-shadow:
        0 0 10px rgba(0, 212, 255, 0.8),
        0 0 20px rgba(0, 212, 255, 0.4);
    }


    /* =========================
       INPUT
    ========================= */

    .input-area {
      display: flex;

      gap: 8px;

      padding: 10px;

      background: rgba(0, 0, 0, 0.18);

      border-top:
        1px solid rgba(0, 212, 255, 0.18);
    }

    .message-box {
      flex: 1;

      min-height: 42px;
      max-height: 90px;

      padding: 11px 13px;

      background: rgba(0, 0, 0, 0.18);

      border:
        1px solid rgba(0, 212, 255, 0.3);

      border-radius: 10px;

      color: white;

      font-size: 0.9em;

      outline: none;

      overflow-y: auto;
    }

    .message-box:focus {
      border-color: #00d4ff;

      box-shadow:
        0 0 10px rgba(0, 212, 255, 0.2);
    }

    .message-box:empty::before {
      content: "ASK ANY QUESTION...";

      color: rgba(255, 255, 255, 0.5);

      pointer-events: none;
    }


    /* =========================
       SEND
    ========================= */

    .send-button {
      align-self: flex-end;

      height: 42px;

      padding: 0 18px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #00d4ff,
          #0099cc
        );

      color: #001117;

      font-size: 0.82em;

      font-weight: 800;

      letter-spacing: 0.8px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .send-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 6px 15px rgba(0, 212, 255, 0.35);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      h1 {
        margin-top: 35px;
        font-size: 1.7em;
      }

      .chat-container {
        width: 94%;
        height: 55vh;
        margin-top: 18px;
      }

      .welcome {
        margin-top: 60px;
      }

      .input-area {
        padding: 8px;
      }

      .send-button {
        padding: 0 14px;
      }
    }

  </style>
</head>


<body>

  <h1>ASK ANY QUESTION</h1>

  <p class="subtitle">
    ENTER THE ZENOVERSE. THINK. CREATE. EXPLORE.
  </p>


  <div class="chat-container">

    <div class="messages">

      <div class="welcome">
        ZENO IS READY.
      </div>

    </div>


    <div class="input-area">

      <div
        class="message-box"
        contenteditable="true"
        role="textbox"
        aria-label="Ask ZENO a question"
      ></div>

      <button class="send-button">
        SEND
      </button>

    </div>

  </div>

</body>
</html>
