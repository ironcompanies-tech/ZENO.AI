<!DOCTYPE html>
<html>
<head>
  <title>CHAT WITH ZENO</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background-image: url("zeno-bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow: hidden;
    }


    /* =========================
       HEADER
    ========================= */

    h1 {
      margin-top: 45px;

      color: #00d4ff;

      font-size: 2.2rem;

      letter-spacing: 3px;

      text-align: center;

      text-shadow:
        0 0 12px rgba(0, 212, 255, 0.8),
        0 0 28px rgba(0, 212, 255, 0.4);
    }

    .subtitle {
      margin-top: 6px;

      color: #dffbff;

      font-size: 0.85rem;

      letter-spacing: 1px;

      text-align: center;

      text-shadow:
        0 0 8px rgba(0, 212, 255, 0.4);
    }


    /* =========================
       CHAT WINDOW
    ========================= */

    .chat-container {
      width: 88%;

      max-width: 850px;

      height: 58vh;

      margin-top: 25px;

      display: flex;

      flex-direction: column;

      background: rgba(0, 0, 0, 0.08);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      border:
        1px solid rgba(0, 212, 255, 0.25);

      border-radius: 16px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.3),
        0 0 30px rgba(0, 212, 255, 0.06);

      overflow: hidden;
    }


    /* =========================
       MESSAGE AREA
    ========================= */

    .messages {
      flex: 1;

      padding: 25px;

      overflow-y: auto;

      display: flex;

      justify-content: center;

      align-items: center;
    }

    .welcome {
      color: white;

      font-size: 1.3rem;

      font-weight: 700;

      letter-spacing: 1.5px;

      text-align: center;

      text-shadow:
        0 0 10px rgba(0, 212, 255, 0.9),
        0 0 25px rgba(0, 212, 255, 0.5);
    }


    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      display: flex;

      align-items: flex-end;

      gap: 9px;

      padding: 11px;

      background: rgba(0, 0, 0, 0.2);

      border-top:
        1px solid rgba(0, 212, 255, 0.18);
    }


    /* =========================
       MESSAGE BOX
    ========================= */

    .message-box {
      flex: 1;

      min-height: 45px;

      max-height: 110px;

      padding: 12px 14px;

      background: rgba(0, 0, 0, 0.18);

      border:
        1px solid rgba(0, 212, 255, 0.3);

      border-radius: 11px;

      color: white;

      font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

      font-size: 0.92rem;

      line-height: 1.4;

      outline: none;

      overflow-y: auto;

      transition:
        border 0.2s ease,
        box-shadow 0.2s ease;
    }

    .message-box:focus {
      border-color: #00d4ff;

      box-shadow:
        0 0 12px rgba(0, 212, 255, 0.25);
    }

    .message-box:empty::before {
      content: "ASK ANY QUESTION...";

      color: rgba(255, 255, 255, 0.5);

      pointer-events: none;
    }


    /* =========================
       SEND BUTTON
    ========================= */

    .send-button {
      flex-shrink: 0;

      height: 45px;

      padding: 0 20px;

      border: none;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #00d4ff,
          #0099cc
        );

      color: #001117;

      font-size: 0.82rem;

      font-weight: 800;

      letter-spacing: 0.8px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .send-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 7px 18px rgba(0, 212, 255, 0.35);
    }

    .send-button:active {
      transform: translateY(0);
    }


    /* =========================
       DESKTOP LARGE SCREENS
    ========================= */

    @media (min-width: 1000px) {

      h1 {
        margin-top: 50px;

        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 0.9rem;
      }

      .chat-container {
        width: 82%;

        max-width: 900px;

        height: 60vh;

        margin-top: 28px;
      }

      .messages {
        padding: 30px;
      }

      .welcome {
        font-size: 1.4rem;
      }

      .input-area {
        padding: 13px;
      }

      .message-box {
        min-height: 48px;

        font-size: 0.95rem;
      }

      .send-button {
        height: 48px;

        padding: 0 23px;
      }
    }


    /* =========================
       TABLETS
    ========================= */

    @media (max-width: 800px) {

      h1 {
        margin-top: 38px;

        font-size: 2rem;
      }

      .chat-container {
        width: 92%;

        height: 60vh;
      }

      .welcome {
        font-size: 1.15rem;
      }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        background-position: center;

        overflow: hidden;
      }

      h1 {
        margin-top: 28px;

        font-size: 1.65rem;

        letter-spacing: 1.5px;
      }

      .subtitle {
        margin-top: 5px;

        padding: 0 20px;

        font-size: 0.72rem;

        line-height: 1.4;
      }

      .chat-container {
        width: 94%;

        height: calc(100vh - 145px);

        margin-top: 18px;

        border-radius: 14px;
      }

      .messages {
        padding: 15px;
      }

      .welcome {
        font-size: 1.05rem;

        letter-spacing: 1px;
      }

      .input-area {
        padding: 8px;

        gap: 6px;
      }

      .message-box {
        min-height: 44px;

        max-height: 100px;

        padding: 11px;

        font-size: 0.88rem;

        border-radius: 10px;
      }

      .send-button {
        height: 44px;

        padding: 0 14px;

        border-radius: 10px;

        font-size: 0.75rem;
      }
    }


    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

      h1 {
        margin-top: 24px;

        font-size: 1.45rem;
      }

      .subtitle {
        font-size: 0.68rem;
      }

      .chat-container {
        width: 96%;

        height: calc(100vh - 130px);
      }

      .welcome {
        font-size: 0.95rem;
      }

      .send-button {
        padding: 0 12px;
      }
    }

  </style>
</head>


<body>

  <h1>ASK ANY QUESTION</h1>

  <p class="subtitle">
    ENTER THE ZENOVERSE. THINK. CREATE. EXPLORE.
  </p>


  <div class="chat-container">

    <div class="messages">

      <div class="welcome">
        ZENO IS READY.
      </div>

    </div>


    <div class="input-area">

      <div
        class="message-box"
        contenteditable="true"
        role="textbox"
        aria-label="Ask ZENO a question"
      ></div>

      <button class="send-button">
        SEND
      </button>

    </div>

  </div>

</body>
</html>
